x-app-env: &app-env
  APP_ENV: production
  APP_DEBUG: "false"
  APP_KEY: ${APP_KEY:?APP_KEY belum diisi di .env}
  APP_URL: ${APP_URL:?APP_URL belum diisi di .env}
  PORT: "8000"
  PHP_CLI_SERVER_WORKERS: "4"
  DB_CONNECTION: mysql
  DB_HOST: db
  DB_PORT: "3306"
  DB_DATABASE: ${DB_DATABASE:-bumdesma_tarub}
  DB_USERNAME: ${DB_USERNAME:-sikad}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD belum diisi di .env}
  SESSION_DRIVER: file
  SESSION_SECURE_COOKIE: "true"
  CACHE_DRIVER: file
  QUEUE_CONNECTION: sync
  FILESYSTEM_DISK: local
  LOG_CHANNEL: stderr
  LOG_LEVEL: error
  TZ: Asia/Jakarta

x-app: &app
  build: .
  image: sikad-app:latest
  env_file: .env
  environment: *app-env
  volumes:
    - ./storage:/app/storage
  restart: unless-stopped

services:
  app:
    <<: *app
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r \"exit(@fsockopen('127.0.0.1', 8000) ? 0 : 1);\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  scheduler:
    <<: *app
    command: php artisan schedule:work
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.0
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-bumdesma_tarub}
      MYSQL_USER: ${DB_USERNAME:-sikad}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD belum diisi di .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD belum diisi di .env}
      TZ: Asia/Jakarta
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  db_data:
  caddy_data:
  caddy_config:
